# pnpm settings for this (single-package) repo.
#
# Overrides live here rather than in package.json "pnpm": newer pnpm versions
# read settings from this file only (decisions B7/N5). Each pin stays within
# the major version its dependents asked for; `pnpm audit --fix` adds unbounded
# ">=" ranges that jump majors, so use its output as a reference only.

overrides:
  'glob@11': '^11.1.0'
  'follow-redirects': '^1.16.2'
  'lodash': '^4.18.1'
  'js-yaml@3': '^3.15.2'
  'yaml@1': '^1.10.3'
  'yaml@2': '^2.9.0'
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@2': '^2.1.7'
  'minimatch@3': '^3.1.5'
  'minimatch@7': '^7.4.9'
  'minimatch@9': '^9.0.7'
  'minimatch@10': '^10.2.3'
  'picomatch@2': '^2.3.2'
  'picomatch@4': '^4.0.4'
  'postcss': '^8.5.23'
  '@babel/core@7': '^7.29.6'
  '@babel/plugin-transform-modules-systemjs@7': '^7.29.4'
  '@humanfs/node': '^0.16.8'
  '@isaacs/brace-expansion@5': '^5.0.1'
