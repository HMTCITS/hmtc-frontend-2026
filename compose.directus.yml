# Local Directus for CMS development. Not used in staging or production.
#
#   pnpm directus:setup   start, load the production schema, seed, restart
#   pnpm directus:down    stop (data kept)
#   pnpm directus:reset   stop and delete all local data
#
# Studio: http://localhost:8055 — admin@example.com / admin-local
# Guide:  docs/local-development.md
name: hmtc-cms-local

services:
  directus_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: directusdb
      POSTGRES_USER: directuspg
      POSTGRES_PASSWORD: directuspg-local
    volumes:
      - directus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U directuspg -d directusdb']
      interval: 3s
      timeout: 3s
      retries: 20

  directus:
    # Keep in step with production (Directus 11.1.2).
    image: directus/directus:11.1.2
    depends_on:
      directus_postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8055:8055'
    environment:
      SECRET: local-development-only-not-a-secret
      PUBLIC_URL: http://localhost:8055
      DB_CLIENT: pg
      DB_HOST: directus_postgres
      DB_PORT: '5432'
      DB_DATABASE: directusdb
      DB_USER: directuspg
      DB_PASSWORD: directuspg-local
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin-local
      CACHE_ENABLED: 'false'
      WEBSOCKETS_ENABLED: 'false'
      TELEMETRY: 'false'
    volumes:
      - ./directus:/directus/hmtc:ro
      - directus_uploads:/directus/uploads
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/health || exit 1']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  directus_postgres:
  directus_uploads:
