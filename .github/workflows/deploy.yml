name: CI/CD Deploy

on:
  workflow_run:
    workflows:
      - Build and publish Docker image to GHCR
    branches:
      - main
      - staging
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS (main)
        if: ${{ github.event.workflow_run.head_branch == 'main' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "=== DEPLOY MAIN (PRODUCTION) ==="
          echo "Target host: $DEPLOY_HOST"

          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            deploy@"$DEPLOY_HOST" '
              set -e
              cd ../../data/hmtc-deployment
              docker compose -p hmtc-prod --env-file .env.prod -f docker-compose.prod.yml pull
              docker compose -p hmtc-prod --env-file .env.prod -f docker-compose.prod.yml up -d
            '

          echo "Main deploy finished."

      - name: Deploy to VPS (staging)
        if: ${{ github.event.workflow_run.head_branch == 'staging' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "=== DEPLOY STAGING ==="
          echo "Target host: $DEPLOY_HOST"

          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            deploy@"$DEPLOY_HOST" '
              set -e
              cd ../../data/hmtc-deployment
              docker compose -p hmtc-staging --env-file .env.staging -f docker-compose.staging.yml pull
              docker compose -p hmtc-staging --env-file .env.staging -f docker-compose.staging.yml up -d
            '

          echo "Staging deploy finished."
